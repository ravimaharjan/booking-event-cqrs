# Caching reverse proxy in front of the app. Stands in for a CDN: it caches public GET /api/queries responses for the
# lifetime the app allows in Cache-Control (s-maxage), collapses concurrent misses into one request to the app, and
# never caches requests that carry an X-Read-After token.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    keepalive_requests 100000;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api:50m max_size=500m inactive=60s use_temp_path=off;

    upstream app {
        server app:8080;
        keepalive 512;
    }

    server {
        listen 80 backlog=4096;

        location /api/queries/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_cache api;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$request_uri";

            # A request carrying the read-after token must reach the app (it wants its own write) and its answer
            # must not be stored for others.
            proxy_cache_bypass $http_x_read_after;
            proxy_no_cache $http_x_read_after;

            # Many requests missing at once: one goes to the app, the rest wait for its answer.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            # After expiry, answer from the old copy while one request refreshes it in the background.
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            proxy_cache_background_update on;

            add_header X-Proxy-Cache $upstream_cache_status always;
        }

        # Commands and everything else always go to the app.
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
