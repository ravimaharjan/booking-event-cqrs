spring:
  application:
    name: event-booking-cqrs
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts: a slow or dead Redis must cost a few ms per request, not seconds.
      timeout: 200ms
      connect-timeout: 200ms
  kafka:
    # Host port 29092 when the app runs outside Docker, kafka:9092 inside compose.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # A fresh consumer group replays the topic. Extra invalidations are harmless.
      auto-offset-reset: earliest
  flyway:
    # Migrations always run against the primary; the replica receives the schema via replication.
    locations: classpath:db/migration

app:
  datasource:
    primary:
      jdbc-url: ${PRIMARY_URL:jdbc:postgresql://localhost:15432/booking}
      username: ${DB_USER:booking}
      password: ${DB_PASSWORD:booking}
      maximum-pool-size: ${PRIMARY_POOL_SIZE:20}
    replica:
      jdbc-url: ${REPLICA_URL:jdbc:postgresql://localhost:15433/booking}
      username: ${DB_USER:booking}
      password: ${DB_PASSWORD:booking}
      maximum-pool-size: ${REPLICA_POOL_SIZE:40}
      read-only: true
  consistency:
    # lsn  : token is the primary's WAL position; a read goes to the replica only once it has replayed that LSN.
    # time : token is the commit time; reads within read-after-window of it are pinned to the primary.
    mode: ${CONSISTENCY_MODE:lsn}
    # time mode: set a bit above the worst replication lag you expect.
    read-after-window: ${READ_AFTER_WINDOW:5s}
    # lsn mode: how long a read waits for the replica to catch up before falling back to the primary.
    lsn-wait-timeout: ${LSN_WAIT_TIMEOUT:100ms}
  cache:
    enabled: ${CACHE_ENABLED:true}
    event-ttl: 60s
    list-ttl: 30s
    booking-ttl: 10m
    # Second invalidation, after the replica has caught up. Keep equal to read-after-window.
    second-invalidation-delay: ${READ_AFTER_WINDOW:5s}
    # Stale-while-revalidate: after this fraction of the TTL an entry is still served, and one request
    # refreshes it in the background. See single-flight-vs-stale-while-revalidate.md.
    soft-ttl-ratio: 0.8
    # Single-flight rebuild of a missing key: lock safety expiry, and how long other requests wait for the
    # rebuilder before loading the value themselves.
    rebuild-lock-ttl: 5s
    rebuild-wait: 1s
    # In-process cache (L1) in front of Redis. Also the extra staleness it can add. 0 disables it.
    local-ttl: 500ms
    local-max-entries: 10000

  # Cache-Control on public query responses so a proxy or CDN in front can answer repeated requests itself.
  http-cache:
    enabled: ${HTTP_CACHE_ENABLED:true}
    shared-max-age: 1s
    stale-while-revalidate: 5s

logging:
  file:
    # Relative to the working directory: ./logs/app.log locally, /app/logs/app.log in the container
    # (docker-compose mounts that folder to ./logs on the host). Console logging stays on as well.
    name: ${LOG_FILE:logs/app.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    # Set APP_LOG_LEVEL=DEBUG to see the debug statements written in this project.
    com.example.eventbooking: ${APP_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
